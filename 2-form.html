<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/goit-js-hw-09/2-form.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-09/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-09/assets/styles-DuXzkUQ6.css">
  </head>
  <body>
    <main>
      <div class="backdrop">
        <div class="modal">
          <a class="modal-close-btn" href="./index.html" aria-label="Close">
            <svg
              class="modal-close-icon"
              width="8"
              height="8"
              viewBox="0 0 8 8"
              fill="none"
              xmlns="http://w3.org"
            >
              <path
                d="M0.8 0.8L7.2 7.2M7.2 0.8L0.8 7.2"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </a>

          <h1 class="main-title visually-hidden">Form</h1>
          <form class="feedback-form" autocomplete="off">
            <label class="feedback-form_label">
              Email
              <input
                class="feedback-form_input"
                type="email"
                name="email"
                autofocus
              />
            </label>
            <label class="feedback-form_label">
              Message
              <textarea
                class="feedback-form_input feedback-form_textarea"
                name="message"
                rows="8"
              ></textarea>
            </label>
            <button class="feedback-form_button" type="submit">Submit</button>
          </form>
        </div>
      </div>
    </main>

  </body>
</html>
